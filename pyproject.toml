[project]
name = "seed-vr-2-5-easy-gui"
version = "1.0.0"
description = "SeedVR 2.5 Easy GUI - image-only local upscaling"
requires-python = ">=3.12,<3.14"
dependencies = [
    "gradio>=6.24.0",
    "huggingface_hub[hf_xet]>=1.0.0",
    "hf_xet>=1.6.0",
    "torch>=2.6.0",
    "torchvision>=0.21.0",
    "opencv-python>=4.10",
    "numpy>=2.0",
    "Pillow>=10.4",
    "safetensors>=0.5",
    "spandrel>=0.4",
]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
